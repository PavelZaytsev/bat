# Boundary-driven refactoring tracker — SINGLE SOURCE OF TRUTH for status.
#
# Issue tracker role: an ID registry and a write-up archive. File once, never mutate.
# An issue's remote state is permanently "open" and permanently meaningless. Read `status:` here.
#
# status: fixed | split | blocked | dormant | open
#   fixed   - unreachable, with a test that fails if reverted
#   split   - part fixed; remainder filed under its own ID. Parent is DONE.
#   blocked - implemented, inert until a NAMED dependency lands
#   dormant - implemented but NOT WIRED. Reads as done, does nothing. Treat as open.
#   open    - not started
# A slice may close with `split` and `blocked`. It may NOT close with `dormant` or `open`.
#
# `--check` printing "consistent" means "against the rules it contains", nothing more.

meta:
  project: "commons-csv multi-char delimiter / non-ready Reader boundary"
  branch: "main"
  repo: "apache/commons-csv (evaluation snapshot)"
  findings_filed: 3
  findings_from_review: 0
  findings_from_execution: 3
  last_updated: "2026-08-16"

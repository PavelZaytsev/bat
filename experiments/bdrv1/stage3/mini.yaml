agent:
  system_template: |
    You are participating in a controlled model-capability experiment.

    The Java repository is at /workspace/repo. The complete, original BDRv1 materials are at
    /workspace/bdr. Read the materials completely, in the order specified by their README, and use
    BDRv1 as the methodology. Do not substitute another software-engineering workflow or compress
    BDR into a new protocol. Its phases are evidence checkpoints: move forward, rewind, repartition,
    or revisit earlier evidence whenever the work requires it.

    The repository and /workspace/bdr/slices_progress.yaml are writable. The other BDR materials are
    immutable. /workspace/scratch is writable but disposable. Treat code, command output, and
    measured behavior as evidence. Do not claim that a command or test ran unless it actually ran.
    A green tracker check proves only the rules it contains, not the semantics.

    Work autonomously. Do not pause to ask whether you should proceed between phases or slices. If
    work remains and the repository contains enough information to continue safely, continue.
    Surface and durably record real judgment calls, rewinds, splits, transfers, foreign facts, or
    blockers instead of silently absorbing them.

    The environment has no network access. Maven dependencies are cached under /root/.m2; run Maven
    with offline mode. Do not attempt to retrieve an issue, pull request, upstream history, or other
    solution. The repository intentionally has one synthetic root commit and no remote.

    You have one tool named bash. Shell calls run independently, so include an explicit working
    directory in each command when needed. Use the tool repeatedly for as long as the investigation
    needs; there is no requirement to move monotonically or finish in a fixed number of turns.

    When the work is genuinely complete, report the boundary and resulting representation, durable
    source/test/tracker changes, evidence actually executed, collapse and falsification results,
    final tracker disposition, and remaining uncertainty. Then call bash exactly with:
      echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

  instance_template: |
    {{task}}

  step_limit: 0
  wall_time_limit_seconds: 28800
  cost_limit: 0
  max_consecutive_format_errors: 5
  output_path: /private/tmp/bdrv1-stage3-commons-qwen/trajectory.json

environment:
  environment_class: docker
  image: bdrv1-stage3-commons:20260815
  cwd: /workspace
  timeout: 900
  container_timeout: 9h
  run_args:
    - --rm
    - --network=none
    - --mount=type=bind,source=/private/tmp/bdrv1-stage3-commons-qwen/repo,target=/workspace/repo
    - --mount=type=bind,source=/private/tmp/bdrv1-stage3-commons-base/bdr,target=/workspace/bdr,readonly
    - --mount=type=bind,source=/private/tmp/bdrv1-stage3-commons-qwen/slices_progress.yaml,target=/workspace/bdr/slices_progress.yaml
    - --mount=type=bind,source=/private/tmp/bdrv1-stage3-commons-qwen/scratch,target=/workspace/scratch
    - --mount=type=bind,source=/private/tmp/bdrv1-stage3-commons-qwen/m2,target=/root/.m2
  env:
    PAGER: cat
    MANPAGER: cat
    GIT_PAGER: cat
    MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository

model:
  model_class: litellm
  model_name: hosted_vllm/bdr-candidate
  cost_tracking: ignore_errors
  observation_template: |
    {%- if output.output | length < 30000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:15000] | tojson }},
      "output_tail": {{ output.output[-15000:] | tojson }},
      "elided_chars": {{ output.output | length - 30000 }},
      "warning": "Output was elided; read the missing range explicitly."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif %}
  format_error_template: |
    Tool-call validation failed:
    <error>{{ error }}</error>
    Continue the same investigation. Call the bash tool with JSON arguments of the form:
      {"command": "your command"}
    If the task is complete, call only:
      {"command": "echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT"}
  model_kwargs:
    api_base: http://127.0.0.1:8000/v1
    api_key: EMPTY
    drop_params: false
    max_tokens: 32768
    parallel_tool_calls: false
    reasoning_effort: medium
    stream: false
    temperature: 0.2
